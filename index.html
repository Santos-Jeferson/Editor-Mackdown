<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Markdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <main class="app" id="app" data-view="split">
        <header class="topo">
            <div class="topo-texto">
                <p class="eyebrow">Projeto Front-End</p>
                <h1>Editor de Markdown</h1>
                <p>Escreva em Markdown, visualize em tempo real e exporte seus arquivos.</p>
            </div>

            <div class="topo-acoes" arial-label="Controles principais">
                <label class="campo-tema" for="themeSelect">
                    <span>Tema</span>
                    <select id="themeSelect" arial-label="Escolher tema visual">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="github">GitHub</option>
                        <option value="dracula">Dracula</option>
                        <option value="terminal">Terminal</option>
                    </select>
                </label>

                <button class="btn btn-secundario" id="fullscreenBtn" type="button" title="Alterar tela cheia">Tela cheia</button>
            </div>
        </header>

        <section class="stats" arial-label="Estatíticas do texto">
            <span><strong id="wordCount">0</strong> palavras</span>
            <span><strong id="charCount">0</strong> caracteres</span>
            <span><strong id="lineCount">0</strong> linhas</span>
            <span><strong id="readingTime">0</strong> min de leitura</span>
            <span class="status-salvamento" id="saveStatus">Pronto</span>
        </section>

        <section class="toolbar" arial-label="Barra de ferramentas">
            <div class="grupo-toolbar" arial-label="Formatação rápida">
                <button class="btn" type="button" data-action="h1" title="Título">H1</button>
                <button class="btn" type="button" data-action="h2" title="Subtitulo">H2</button>
                <button class="btn" type="button" data-action="bolt" title="Negrito">Ctrl+B</button>
                <button class="btn" type="button" data-action="italic" title="Itálico">Ctrl+I</button>
                <button class="btn" type="button" data-action="link" title="Link: Ctrl + K">Link</button>
                <button class="btn" type="button" data-action="image" title="Imagem Markdown">Imagem</button>
                <button class="btn" type="button" data-action="inlineCode" title="Código inline">`code`</button>
                <button class="btn" type="button" data-action="codeBlock" title="Bloco de código">Bloco</button>
                <button class="btn" type="button" data-action="quote" title="Citação">Citação</button>
                <button class="btn" type="button" data-action="ul" title="Lista">Lista</button>
                <button class="btn" type="button" data-action="task" title="Lista de tarefas">Task</button>
                <button class="btn" type="button" data-action="table" title="Tabela">Tabela</button>
                <button class="btn" type="button" data-action="hr" title="Linha divisória">Linha</button>
            </div>

            <div class="grupo-toolbar" arial-label="Arquivos e utilidades">
                <button class="btn btn-secundario" type="button" id="copyMarkkdownBtn">Copiar MD</button>
                <button class="btn btn-secundario" type="button" id="copyGtmlBtn">Copiar HTML</button>
                <button class="btn btn-secundario" type="button" id="exportMarkdownBtn">Exportar .md</button>
                <button class="btn btn-secundario" type="button" id="exportHtmlBtn">Exportar HTML</button>
                <button class="btn btn-secundario" type="button" id="exportPdfBtn">Exportar PDF</button>
                <button class="btn btn-secundario" type="button" id="importBtn">Importar .md</button>
                <button class="btn btn-secundario" type="button" id="clearBtn">Limpar</button>
                <button class="btn btn-secundario" type="button" id="restoreBtn">Restaurar exemplo</button>

                <input id="fileInput" type="file" accpt=".md,.markdown,.txt" hidden>
            </div>

            <div class="grupo=toolbar grupo-avancado" ariaç-label="Templates e histórico">
                <select id="templateSelect" arial-label="Escolher template">
                    <option value="readme">Template README</option>
                    <option value="documentacao">Template Documentação</option>
                    <option value="artigo">Template Artigo</option>
                </select>

                <button class="btn btn-secundario" type="button" id="applyTemplateBtn">Usar template</button>

                <button class="btn btn-secundario" type="button" id="saveVersionBtn">Salvar versão</button>

                <select id="historySelect" arial-label="Histórico de versões">
                    <option value="">Histórico vazio</option>
                </select>

                <button class="btn btn-secundario" type="button" id="loadVersionBtn">Carregar</button>

                <button class="btn btn-secundario" type="button" id="deleteVersionBtn">Deletar versão</button>
            </div>
        </section>

        <nav class="view-tabs" arial-label="Modo de visualização">
            <buton class="tab-ativo" type="button" data-view="split">Dividido</buton>
            <buton class="tab-ativo" type="button" data-view="editor">Editor</buton>
            <buton class="tab-ativo" type="button" data-view="preview">Visualização</buton>
        </nav>

        <section class="editor-area">
            <article class="painel editor-panel">
                <div class="painel-topo">
                    <div>
                        <h2>Markdown</h2>
                        <p>Entrada de texto</p>
                    </div>
                    <span>Escreva aqui</span>
                </div>

                <textarea id="markdowmInput" spellCheck="false" placeholder="Digite seu Markdown aqui..."></textarea>
            </article>

            <article class="painel preview-panel">
                <div class="painel-topo">
                    <div>
                        <h2>Preview</h2>
                        <p>Resultado convertido</p>
                    </div>
                    <span>Ao vivo</span>
                </div>

                <article id="preview" class="preview markdown-body"></article>
            </article>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
